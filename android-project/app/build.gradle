plugins {
    id 'com.android.application'
}

def signingPath = System.getenv('CARE24_ANDROID_KEYSTORE')
def signingPassword = System.getenv('CARE24_ANDROID_STORE_PASSWORD')

android {
    namespace 'kr.or.care24.app'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.or.care24.app'
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName '1.1.5'
        manifestPlaceholders = [twaHost: 'care.xn--24-ts1i486c.com', twaUrl: 'https://care.xn--24-ts1i486c.com/', launcherActivity: '.MainActivity', launcherTheme: '@android:style/Theme.Translucent.NoTitleBar']
    }

    signingConfigs {
        if (signingPath && signingPassword) {
            production {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias 'care24-upload'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            manifestPlaceholders.launcherActivity = '.LocalPreviewActivity'
            manifestPlaceholders.launcherTheme = '@style/Theme.Care24'
            manifestPlaceholders.twaHost = 'care.xn--24-ts1i486c.com'
            manifestPlaceholders.twaUrl = 'https://care.xn--24-ts1i486c.com/'
        }
        release {
            if (signingPath && signingPassword) signingConfig signingConfigs.production
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android.sourceSets.main.assets.srcDirs = []

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            if (!signingPath || !signingPassword) throw new GradleException('Release signing requires CARE24_ANDROID_KEYSTORE and CARE24_ANDROID_STORE_PASSWORD.')
        }
    }
}

